services:
  - type: web
    name: sistema-agua-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        value: agua-s3cret-k3y-2026-pr0d-x7m9
      - key: CORS_ORIGIN
        sync: false
      - key: PORT
        value: 3001

  - type: web
    name: sistema-agua-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: /api
